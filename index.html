<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Question! ❤️</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.25);
            --pink: #ff85a2;
            --blue: #a6c1ee;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbc2eb 0%, var(--blue) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Prevents scrolling when button moves */
            position: relative;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        h1 {
            color: #444;
            font-size: 1.5rem;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.1s active;
        }

        #yesBtn {
            background: var(--pink);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 133, 162, 0.3);
        }

        #noBtn {
            background: white;
            color: var(--pink);
            position: absolute; /* Allows free movement */
            left: 55%; /* Initial position offset from Yes */
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .celebration {
            display: none;
            font-size: 1.2rem;
            color: #d63384;
            margin-top: 20px;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="mainHeading">Are you Donkey🫏?</h1>
        
        <div class="btn-container">
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>

        <div class="celebration" id="successMsg">
            Yay! I knew you'd agree. 🥰
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const heading = document.getElementById('mainHeading');
        const success = document.getElementById('successMsg');

        function moveButton() {
            // Calculate safe boundaries so the button doesn't go off-screen
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.position = 'fixed'; // Breaks out of the container to move anywhere
        }

        // 'touchstart' is the mobile equivalent for the teaser effect
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents the actual click
            moveButton();
        });

        // Backup for mobile browsers that simulate mouse events
        noBtn.addEventListener('mouseover', moveButton);

        yesBtn.addEventListener('click', () => {
            noBtn.style.display = 'none';
            heading.innerText = "Correct! ✅";
            success.style.display = 'block';
            
            // Add a little vibration if supported
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        });
    </script>
</body>
</html>
